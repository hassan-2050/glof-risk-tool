[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glof-risk-tool"
version = "0.1.0"
description = "Proxy-augmented GLOF screening and multi-agent humanitarian reporting for Nepal"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: spawns subprocesses (full reproduce runs); still part of the gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"
